# Referencia para probar la imagen localmente. NO reemplaza ni toca los
# contenedores/servicios ya existentes en el VPS de Hostinger (MySQL,
# Traefik) — se conecta a la red Docker externa "banarica-network" donde ya
# vive el contenedor "banarica-mysql", en vez de crear una red propia.
services:
  api-rest-banarica:
    build: .
    image: ghcr.io/heywinmeneseshp/api-rest-banarica:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    networks:
      - banarica-network

networks:
  banarica-network:
    external: true
